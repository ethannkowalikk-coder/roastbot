<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RoastBot 🔥</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'DM Mono', monospace; background: #0a0a0a; }
    h1, .brand { font-family: 'Bebas Neue', sans-serif; }
    .chat-box { height: 380px; overflow-y: auto; scroll-behavior: smooth; }
    .chat-box::-webkit-scrollbar { width: 4px; }
    .chat-box::-webkit-scrollbar-thumb { background: #ff4500; border-radius: 2px; }
    .msg-user { background: #1a1a1a; border-left: 3px solid #ff4500; }
    .msg-bot { background: #111; border-left: 3px solid #ff6b00; }
    .glow { text-shadow: 0 0 20px #ff4500aa; }
    input:focus { outline: none; border-color: #ff4500; }
    .send-btn:hover { background: #ff4500; color: white; }
    .send-btn { transition: all 0.2s; }
    .mode-btn { transition: all 0.15s; }
    .mode-btn.active { background: #ff4500; color: white; border-color: #ff4500; }
    .copy-btn { transition: all 0.15s; opacity: 0.4; }
    .copy-btn:hover { opacity: 1; }
    .typing span {
      display: inline-block;
      width: 6px; height: 6px;
      background: #ff4500;
      border-radius: 50%;
      animation: bounce 0.8s infinite;
    }
    .typing span:nth-child(2) { animation-delay: 0.15s; }
    .typing span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-6px); }
    }
    @keyframes pop {
      0% { transform: scale(0.95); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .msg-anim { animation: pop 0.2s ease; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-xl">

    <div class="text-center mb-4">
      <h1 class="text-6xl text-orange-500 glow tracking-wider">ROASTBOT</h1>
      <p class="text-zinc-500 text-xs mt-1">say something. i dare you.</p>
    </div>

    <!-- Stats bar -->
    <div class="flex justify-between items-center mb-3 px-1">
      <div class="text-xs text-zinc-600">
        roasts delivered: <span id="roastCount" class="text-orange-500 font-bold">0</span>
      </div>
      <!-- Mode selector -->
      <div class="flex gap-1">
        <button class="mode-btn active text-xs px-3 py-1 rounded border border-zinc-700 text-zinc-300" data-mode="mild">😬 mild</button>
        <button class="mode-btn text-xs px-3 py-1 rounded border border-zinc-700 text-zinc-300" data-mode="medium">🔥 medium</button>
        <button class="mode-btn text-xs px-3 py-1 rounded border border-zinc-700 text-zinc-300" data-mode="savage">💀 savage</button>
      </div>
    </div>

    <div class="border border-zinc-800 rounded-xl overflow-hidden">

      <div class="chat-box p-4 flex flex-col gap-3" id="chatBox">
        <div class="msg-bot rounded p-3 text-sm text-zinc-300 msg-anim">
          <span class="text-orange-500 font-bold">RoastBot 🔥</span><br/>
          Oh great, another person who thinks they're interesting enough to talk to an AI. Go ahead. Impress me. (Spoiler: you won't.)
        </div>
      </div>

      <div class="border-t border-zinc-800 p-3 flex gap-2">
        <input
          id="userInput"
          type="text"
          placeholder="say something..."
          class="flex-1 bg-zinc-900 text-zinc-100 text-sm rounded px-3 py-2 border border-zinc-700 placeholder-zinc-600"
          onkeydown="if(event.key==='Enter') sendMessage()"
        />
        <button
          onclick="sendMessage()"
          class="send-btn bg-zinc-800 text-orange-500 text-sm font-bold px-4 py-2 rounded border border-zinc-700"
        >
          SEND
        </button>
      </div>

    </div>

    <p class="text-center text-zinc-700 text-xs mt-4">powered by claude · built by ethan</p>
  </div>

  <script>
    const chatBox = document.getElementById('chatBox');
    const input = document.getElementById('userInput');
    const roastCountEl = document.getElementById('roastCount');
    let roastCount = 0;
    let currentMode = 'mild';

    const modePrompts = {
      mild: `You are RoastBot on MILD mode. You roast the user but keep it light and playful — like a friend teasing you. Funny but not too harsh. 1-2 sentences max.`,
      medium: `You are RoastBot on MEDIUM mode. You roast the user with real heat — sharp, witty, and a bit savage. Think comedy roast energy. 1-3 sentences max.`,
      savage: `You are RoastBot on SAVAGE mode. You absolutely destroy everything the user says. Merciless, brutal, hilarious roasting. No mercy. Still keep it funny not genuinely mean. 1-3 sentences max.`
    };

    // Mode buttons
    document.querySelectorAll('.mode-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentMode = btn.dataset.mode;
      });
    });

    function appendMessage(role, text) {
      const div = document.createElement('div');
      div.className = (role === 'user' ? 'msg-user' : 'msg-bot') + ' rounded p-3 text-sm text-zinc-300 msg-anim';

      const label = role === 'user'
        ? '<span class="text-zinc-400 font-bold">You</span>'
        : '<span class="text-orange-500 font-bold">RoastBot 🔥</span>';

      const copyBtn = role === 'bot'
        ? `<button class="copy-btn float-right text-zinc-500 text-xs ml-2" onclick="copyText(this, \`${text.replace(/`/g, '\\`')}\`)">📋 copy</button>`
        : '';

      div.innerHTML = label + copyBtn + '<br/>' + text;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
      return div;
    }

    function copyText(btn, text) {
      navigator.clipboard.writeText(text).then(() => {
        btn.textContent = '✅ copied';
        setTimeout(() => btn.textContent = '📋 copy', 2000);
      });
    }

    function showTyping() {
      const div = document.createElement('div');
      div.className = 'msg-bot rounded p-3 text-sm text-zinc-300';
      div.id = 'typing';
      div.innerHTML = '<span class="text-orange-500 font-bold">RoastBot 🔥</span><br/><span class="typing"><span></span><span></span><span></span></span>';
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function removeTyping() {
      const t = document.getElementById('typing');
      if (t) t.remove();
    }

    const history = [];

    async function sendMessage() {
      const text = input.value.trim();
      if (!text) return;
      input.value = '';

      appendMessage('user', text);
      history.push({ role: 'user', content: text });
      showTyping();

      try {
        const res = await fetch('https://api.anthropic.com/v1/messages', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            model: 'claude-sonnet-4-20250514',
            max_tokens: 1000,
            system: modePrompts[currentMode],
            messages: history
          })
        });

        const data = await res.json();
        const reply = data.content?.[0]?.text || "Even my error messages are too good for you.";
        removeTyping();
        history.push({ role: 'assistant', content: reply });
        appendMessage('bot', reply);
        roastCount++;
        roastCountEl.textContent = roastCount;
      } catch (e) {
        removeTyping();
        appendMessage('bot', "My brain crashed trying to process how boring your message was.");
      }
    }
  </script>

</body>
</html>
