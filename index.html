<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RoastBot 🔥</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'DM Mono', monospace; background: #0a0a0a; }
    h1, .brand { font-family: 'Bebas Neue', sans-serif; }
    .chat-box { height: 420px; overflow-y: auto; scroll-behavior: smooth; }
    .chat-box::-webkit-scrollbar { width: 4px; }
    .chat-box::-webkit-scrollbar-thumb { background: #ff4500; border-radius: 2px; }
    .msg-user { background: #1a1a1a; border-left: 3px solid #ff4500; }
    .msg-bot { background: #111; border-left: 3px solid #ff6b00; }
    .glow { text-shadow: 0 0 20px #ff4500aa; }
    input:focus { outline: none; border-color: #ff4500; }
    button:hover { background: #ff4500; }
    button { transition: background 0.2s; }
    .typing span {
      display: inline-block;
      width: 6px; height: 6px;
      background: #ff4500;
      border-radius: 50%;
      animation: bounce 0.8s infinite;
    }
    .typing span:nth-child(2) { animation-delay: 0.15s; }
    .typing span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-6px); }
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-xl">

    <div class="text-center mb-6">
      <h1 class="text-6xl text-orange-500 glow tracking-wider">ROASTBOT</h1>
      <p class="text-zinc-500 text-xs mt-1">say something. i dare you.</p>
    </div>

    <div class="border border-zinc-800 rounded-xl overflow-hidden">

      <div class="chat-box p-4 flex flex-col gap-3" id="chatBox">
        <div class="msg-bot rounded p-3 text-sm text-zinc-300">
          <span class="text-orange-500 font-bold">RoastBot 🔥</span><br/>
          Oh great, another person who thinks they're interesting enough to talk to an AI. Go ahead. Impress me. (Spoiler: you won't.)
        </div>
      </div>

      <div class="border-t border-zinc-800 p-3 flex gap-2">
        <input
          id="userInput"
          type="text"
          placeholder="say something..."
          class="flex-1 bg-zinc-900 text-zinc-100 text-sm rounded px-3 py-2 border border-zinc-700 placeholder-zinc-600"
          onkeydown="if(event.key==='Enter') sendMessage()"
        />
        <button
          onclick="sendMessage()"
          class="bg-zinc-800 text-orange-500 text-sm font-bold px-4 py-2 rounded border border-zinc-700"
        >
          SEND
        </button>
      </div>

    </div>

    <p class="text-center text-zinc-700 text-xs mt-4">powered by claude · built by ethan</p>
  </div>

  <script>
    const chatBox = document.getElementById('chatBox');
    const input = document.getElementById('userInput');

    function appendMessage(role, text) {
      const div = document.createElement('div');
      div.className = (role === 'user' ? 'msg-user' : 'msg-bot') + ' rounded p-3 text-sm text-zinc-300';
      const label = role === 'user'
        ? '<span class="text-zinc-400 font-bold">You</span>'
        : '<span class="text-orange-500 font-bold">RoastBot 🔥</span>';
      div.innerHTML = label + '<br/>' + text;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
      return div;
    }

    function showTyping() {
      const div = document.createElement('div');
      div.className = 'msg-bot rounded p-3 text-sm text-zinc-300';
      div.id = 'typing';
      div.innerHTML = '<span class="text-orange-500 font-bold">RoastBot 🔥</span><br/><span class="typing"><span></span><span></span><span></span></span>';
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function removeTyping() {
      const t = document.getElementById('typing');
      if (t) t.remove();
    }

    const history = [];

    async function sendMessage() {
      const text = input.value.trim();
      if (!text) return;
      input.value = '';

      appendMessage('user', text);
      history.push({ role: 'user', content: text });
      showTyping();

      try {
        const res = await fetch('https://api.anthropic.com/v1/messages', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            model: 'claude-sonnet-4-20250514',
            max_tokens: 1000,
            system: `You are RoastBot, a savage and sarcastic AI roaster. Your job is to roast, clown on, and humorously destroy everything the user says. You are brutally honest, witty, and merciless — but keep it fun and never genuinely mean or harmful. Think of a comedian doing a roast. Use slang, be sharp, be funny. Keep responses short (1-3 sentences max). Never be helpful or nice. Always roast.`,
            messages: history
          })
        });

        const data = await res.json();
        const reply = data.content?.[0]?.text || "Even my error messages are too good for you.";
        removeTyping();
        history.push({ role: 'assistant', content: reply });
        appendMessage('bot', reply);
      } catch (e) {
        removeTyping();
        appendMessage('bot', "My brain crashed trying to process how boring your message was.");
      }
    }
  </script>

</body>
</html>
